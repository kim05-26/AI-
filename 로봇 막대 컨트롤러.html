<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 막대 컨트롤러</title>
<style>
  /* 레이아웃: 화면 전체가 무대. 막대만 있음. 가로 위치 = 로봇 좌우, 크기 = 로봇 앞뒤 */
  :root {
    color-scheme: light;
    --stage: #ffffff;
    --bar: #000000;
    --edge: #ffffff;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: relative; width: 100%; height: 100%; touch-action: none; }
  .bar {
    position: absolute;
    background: var(--bar);
    box-shadow: 0 0 0 1px var(--edge); /* 겹쳤을 때만 보이는 경계선 */
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
(() => {
  // ───── 설정 ─────
  const ASPECT    = 0.16;   // 막대 너비 = 높이 × ASPECT
  const SIZE_MIN  = 0.15;   // 크기 = 화면 높이 대비 막대 높이 (가장 멀리)
  const SIZE_MAX  = 0.85;   // (가장 가까이)
  const SAME_SIZE = 0.05;   // 크기 차이가 이 값보다 작으면 "같은 크기"로 보고 겹침을 막음
  const CORNER    = 26;     // 모서리로 인식하는 영역 크기(px)
  const REACH     = 8;      // 막대 바깥으로 이만큼 벗어나도 잡히게 함(px)
  const START = [
    { id: 1, x: 0.25, size: 0.45 },
    { id: 2, x: 0.50, size: 0.45 },
    { id: 3, x: 0.75, size: 0.45 },
  ];

  // ───── 로봇 연결 지점 ─────
  // 막대 상태가 바뀔 때마다 호출됩니다. 나중에 여기서 로봇으로 명령을 보내면 됩니다.
  //   lateral: 좌우, -1(왼쪽 끝) ~ +1(오른쪽 끝)
  //   depth  : 앞뒤, 0(가장 작음/멀리) ~ 1(가장 큼/가까이)
  function onBarChange(id, lateral, depth) {}

  const stage = document.getElementById('stage');
  let W = 0, H = 0;
  const bars = START.map(s => ({ ...s, el: null }));

  const widthOf = size => size * H * ASPECT;
  const rectOf = b => {
    const w = widthOf(b.size), h = b.size * H;
    return { l: b.x * W - w / 2, t: (H - h) / 2, w, h };
  };

  // (x, size) 상태가 화면 밖이거나, 같은 크기의 다른 막대와 겹치는지
  function collides(b, x, size) {
    const w = widthOf(size), cx = x * W;
    if (cx - w / 2 < 0 || cx + w / 2 > W) return true;
    for (const o of bars) {
      if (o === b) continue;
      if (Math.abs(o.size - size) >= SAME_SIZE) continue;   // 크기가 다르면 겹쳐도 됨
      if (Math.abs(o.x * W - cx) < (widthOf(o.size) + w) / 2) return true;
    }
    return false;
  }

  // 현재 값에서 목표 값까지 조금씩 가 보다가 막히면 그 직전에서 멈춤
  function advance(b, key, target, step) {
    if (collides(b, b.x, b.size)) { b[key] = target; return; } // 이미 겹친 상태면 빠져나올 수 있게 허용
    const dir = Math.sign(target - b[key]);
    while (dir && (target - b[key]) * dir > 1e-9) {
      const next = Math.abs(target - b[key]) < step ? target : b[key] + dir * step;
      const x = key === 'x' ? next : b.x, size = key === 'size' ? next : b.size;
      if (collides(b, x, size)) break;
      b[key] = next;
    }
  }

  function render() {
    const order = [...bars].sort((a, b) => a.size - b.size);
    for (const b of bars) {
      const r = rectOf(b);
      b.el.style.left = r.l + 'px';
      b.el.style.top = r.t + 'px';
      b.el.style.width = r.w + 'px';
      b.el.style.height = r.h + 'px';
      b.el.style.zIndex = 1 + order.indexOf(b);   // 큰 막대가 위
    }
  }

  // 포인터 위치에 있는 막대와 잡은 부위(모서리/몸통)를 찾음. 위에 그려진 막대부터 검사.
  function hitTest(px, py) {
    const order = [...bars].sort((a, b) => b.size - a.size);
    for (const b of order) {
      const r = rectOf(b);
      const dx = px - r.l, dy = py - r.t;
      if (dx < -REACH || dy < -REACH || dx > r.w + REACH || dy > r.h + REACH) continue;
      const cz = Math.min(CORNER, r.h / 3);            // 세로 방향 모서리 영역
      const czx = Math.min(CORNER, r.w / 2);           // 가로 방향: 막대가 좁으면 양쪽 절반씩
      const nearTop = dy < cz, nearBottom = dy > r.h - cz;
      const nearLeft = dx < czx, nearRight = dx > r.w - czx;
      let corner = null;
      if ((nearTop || nearBottom) && (nearLeft || nearRight)) {
        corner = (nearTop ? 'n' : 's') + (nearLeft ? 'w' : 'e');
      }
      return { bar: b, corner };
    }
    return null;
  }

  const cursorFor = hit => !hit ? 'default'
    : !hit.corner ? 'grab'
    : (hit.corner === 'nw' || hit.corner === 'se') ? 'nwse-resize' : 'nesw-resize';

  let drag = null;

  stage.addEventListener('pointerdown', e => {
    const hit = hitTest(e.clientX, e.clientY);
    if (!hit) return;
    e.preventDefault();
    stage.setPointerCapture(e.pointerId);
    const b = hit.bar, cx = b.x * W, cy = H / 2;
    drag = {
      b, resizing: !!hit.corner, cx, cy,
      d0: Math.hypot(e.clientX - cx, e.clientY - cy) || 1,
      size0: b.size,
      grabDx: e.clientX - cx,
    };
    stage.style.cursor = hit.corner ? cursorFor(hit) : 'grabbing';
  });

  stage.addEventListener('pointermove', e => {
    if (!drag) { stage.style.cursor = cursorFor(hitTest(e.clientX, e.clientY)); return; }
    const b = drag.b;
    if (drag.resizing) {
      // 중심 기준 확대/축소: 중심에서 멀어지면 커지고 가까워지면 작아짐
      const d = Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy);
      const target = Math.min(SIZE_MAX, Math.max(SIZE_MIN, drag.size0 * d / drag.d0));
      advance(b, 'size', target, 0.002);
    } else {
      const target = Math.min(1, Math.max(0, (e.clientX - drag.grabDx) / W));
      advance(b, 'x', target, 1 / W);
    }
    render();
    onBarChange(b.id, b.x * 2 - 1, (b.size - SIZE_MIN) / (SIZE_MAX - SIZE_MIN));
  });

  const end = e => { drag = null; stage.style.cursor = cursorFor(hitTest(e.clientX, e.clientY)); };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  for (const b of bars) {
    b.el = document.createElement('div');
    b.el.className = 'bar';
    stage.appendChild(b.el);
  }
  const measure = () => { W = stage.clientWidth; H = stage.clientHeight; render(); };
  measure();
  window.addEventListener('resize', measure);
})();
</script>
</body>
</html>
